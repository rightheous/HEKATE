[project]
name = "hekate"
version = "0.1.0"
description = "Control plane for bounded, auditable agent work"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "PyYAML>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
hekate = "hekate.__main__:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hekate"]
