[project]
name = "hekate"
version = "0.1.0"
description = "Control plane for bounded, auditable agent work"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "PyYAML>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tiktoken==0.14.0",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
hekate = "hekate.__main__:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hekate"]
force-include = { "src/hekate/infrastructure/letta/assets/cl100k_base.tiktoken" = "hekate/infrastructure/letta/assets/cl100k_base.tiktoken", "src/hekate/infrastructure/letta/assets/test_chat_contract.v1.json" = "hekate/infrastructure/letta/assets/test_chat_contract.v1.json", "src/hekate/infrastructure/letta/assets/qwen35_installed_tokenizer.v1.json" = "hekate/infrastructure/letta/assets/qwen35_installed_tokenizer.v1.json", "src/hekate/infrastructure/letta/assets/qwen35_unicode_flags.v1.json" = "hekate/infrastructure/letta/assets/qwen35_unicode_flags.v1.json" }
